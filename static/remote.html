<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Temir · iPhone Remote</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/temir.css">
<style>
  body { min-height: 100dvh; }

  /* ── 접속 화면 ───────────────────────────── */
  #join {
    position: relative; z-index: 1;
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; padding: 24px;
  }
  #join .wordmark { font-size: 34px; }
  #join p { color: var(--dim); font-size: 14px; line-height: 1.7; text-align: center; }
  #join-code {
    width: 240px; text-align: center;
    font-family: var(--font-display); font-size: 34px; font-weight: 600;
    letter-spacing: 0.3em; text-indent: 0.3em;
    padding: 14px 0; border-radius: 14px;
  }
  #join-btn { width: 240px; padding: 15px 0; font-size: 16px; border-radius: 14px; }
  #join-err { color: var(--err); font-size: 13px; min-height: 18px; }

  /* ── 메인 ──────────────────────────────── */
  #main { display: none; position: relative; z-index: 1; min-height: 100dvh; }
  #main.on { display: block; }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    background: linear-gradient(180deg, var(--bg) 70%, transparent);
  }
  header .wordmark { font-size: 15px; }
  header .chip {
    font-family: var(--font-display); font-size: 12px; letter-spacing: 0.18em;
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 4px 12px; color: var(--dim);
    display: flex; align-items: center; gap: 7px;
  }
  header .chip b { color: var(--amber); }
  header .spacer { flex: 1; }
  #btn-idle {
    font-size: 12px; padding: 7px 12px; border-radius: 999px;
    letter-spacing: 0.1em; color: var(--dim);
  }

  .pane { display: none; padding: 10px 16px calc(96px + env(safe-area-inset-bottom)); }
  .pane.on { display: block; animation: rise 0.35s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  .pane h3 { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.24em; color: var(--dim); margin: 18px 0 10px; text-transform: uppercase; }

  .row { display: flex; gap: 10px; }
  .row input { flex: 1; min-width: 0; padding: 14px 16px; font-size: 15px; }
  .row .btn { padding: 0 22px; font-size: 15px; }

  .padgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
  .padgrid .btn { padding: 16px 0; font-size: 17px; border-radius: 14px; }
  .padgrid .btn.wide { grid-column: span 2; }

  .volrow { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  .volrow span { font-size: 18px; }
  input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; border: 0; border-radius: 2px;
    background: linear-gradient(90deg, var(--amber) var(--v, 80%), var(--panel-2) var(--v, 80%));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--amber); border: 3px solid #1a1204;
    box-shadow: 0 0 12px var(--amber-glow);
  }

  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .thumbs button {
    aspect-ratio: 1; border: 2px solid transparent; border-radius: 12px;
    overflow: hidden; padding: 0; background: var(--panel); cursor: pointer;
  }
  .thumbs button.sel { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-glow); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #upload-status { color: var(--dim); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .filebtn { display: block; width: 100%; text-align: center; padding: 16px 0; font-size: 15px; border-radius: 14px; }

  .results { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .results button {
    text-align: left; padding: 13px 15px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font-size: 14px; line-height: 1.5; cursor: pointer;
  }
  .results button small { color: var(--dim); display: block; margin-top: 2px; }
  .geo-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .geo-row .btn { padding: 14px 0; font-size: 14px; }
  .geo-row .btn.live-on { border-color: var(--ok); color: var(--ok); box-shadow: 0 0 0 3px rgba(126, 226, 168, 0.15); }

  textarea#text-input { width: 100%; min-height: 130px; padding: 14px 16px; font-size: 16px; line-height: 1.6; resize: vertical; }
  .seg { display: flex; border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; margin-top: 12px; }
  .seg button {
    flex: 1; padding: 12px 0; background: transparent; border: 0;
    color: var(--dim); font-family: var(--font-display); font-size: 14px; letter-spacing: 0.1em; cursor: pointer;
  }
  .seg button.sel { background: var(--amber); color: #1a1204; font-weight: 700; }
  .sendbtn { width: 100%; margin-top: 14px; padding: 16px 0; font-size: 16px; border-radius: 14px; }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex;
    background: rgba(13, 15, 21, 0.92);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button {
    flex: 1; background: none; border: 0; cursor: pointer;
    padding: 11px 0 9px; color: var(--faint);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav.tabs button .ic { font-size: 21px; }
  nav.tabs button .lb { font-size: 10.5px; letter-spacing: 0.08em; font-family: var(--font-display); }
  nav.tabs button.sel { color: var(--amber); }
  nav.tabs button.sel .ic { filter: drop-shadow(0 0 8px var(--amber-glow)); }
</style>
</head>
<body>

<div id="join">
  <div class="wordmark rise">TEM<span class="tick">I</span>R</div>
  <p class="rise">Tesla 화면에 표시된 <b style="color:var(--text)">코드 6자리</b>를 입력하세요.<br>QR을 스캔했다면 자동으로 연결됩니다.</p>
  <input id="join-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="one-time-code">
  <button id="join-btn" class="btn primary">연결</button>
  <div id="join-err"></div>
</div>

<div id="main">
  <header>
    <div class="wordmark">TEM<span class="tick">I</span>R</div>
    <div class="chip"><b id="hdr-code"></b></div>
    <div class="chip"><span class="dot off" id="hdr-dot"></span><span id="hdr-status">연결 중</span></div>
    <div class="spacer"></div>
    <button id="btn-idle" class="btn">대기화면</button>
  </header>

  <!-- 유튜브 -->
  <section class="pane on" id="pane-youtube">
    <h3>YouTube 보내기</h3>
    <div class="row">
      <input id="yt-url" type="url" placeholder="YouTube 링크 붙여넣기" autocomplete="off">
      <button class="btn primary" id="yt-send">전송</button>
    </div>
    <h3>재생 제어</h3>
    <div class="padgrid">
      <button class="btn" data-ctl="seek" data-delta="-10">−10s</button>
      <button class="btn wide" data-ctl="play" id="yt-toggle">▶ 재생</button>
      <button class="btn" data-ctl="seek" data-delta="10">+10s</button>
      <button class="btn" data-ctl="pause">⏸</button>
      <button class="btn" data-ctl="mute">🔇</button>
      <button class="btn" data-ctl="unmute">🔊</button>
      <button class="btn" data-ctl="seek" data-delta="30">+30s</button>
    </div>
    <div class="volrow">
      <span>🔉</span>
      <input type="range" id="yt-vol" min="0" max="100" value="80">
      <span>🔊</span>
    </div>
  </section>

  <!-- 사진 -->
  <section class="pane" id="pane-photo">
    <h3>사진 업로드</h3>
    <label class="btn primary filebtn">
      사진 선택 (여러 장 가능)
      <input id="photo-file" type="file" accept="image/*" multiple hidden>
    </label>
    <div id="upload-status"></div>
    <div class="padgrid" style="grid-template-columns:1fr 1fr">
      <button class="btn" id="photo-prev">← 이전</button>
      <button class="btn" id="photo-next">다음 →</button>
    </div>
    <div class="thumbs" id="thumbs"></div>
  </section>

  <!-- 지도 -->
  <section class="pane" id="pane-map">
    <h3>장소 검색</h3>
    <div class="row">
      <input id="map-q" type="search" placeholder="장소, 주소 검색" autocomplete="off">
      <button class="btn primary" id="map-search">검색</button>
    </div>
    <div class="results" id="map-results"></div>
    <h3>내 위치</h3>
    <div class="geo-row">
      <button class="btn" id="geo-once">📍 현재 위치 전송</button>
      <button class="btn" id="geo-live">🛰 실시간 추적</button>
    </div>
  </section>

  <!-- 텍스트 -->
  <section class="pane" id="pane-text">
    <h3>차량 화면에 크게 표시</h3>
    <textarea id="text-input" placeholder="예) 5분 뒤에 내려갈게요"></textarea>
    <div class="seg" id="text-size">
      <button data-size="m">보통</button>
      <button data-size="l" class="sel">크게</button>
      <button data-size="xl">아주 크게</button>
    </div>
    <button class="btn primary sendbtn" id="text-send">화면에 표시</button>
  </section>

  <!-- 링크 -->
  <section class="pane" id="pane-link">
    <h3>웹페이지 보내기</h3>
    <div class="row">
      <input id="link-input" type="url" placeholder="https://…" autocomplete="off">
      <button class="btn primary" id="link-send">전송</button>
    </div>
    <p style="color:var(--dim);font-size:13px;line-height:1.7;margin-top:14px">
      Tesla 화면에 링크가 표시되고, 차에서 탭하면 새 탭으로 열립니다.
    </p>
  </section>

  <nav class="tabs">
    <button data-pane="youtube" class="sel"><span class="ic">▶️</span><span class="lb">YOUTUBE</span></button>
    <button data-pane="photo"><span class="ic">🖼</span><span class="lb">PHOTO</span></button>
    <button data-pane="map"><span class="ic">🗺</span><span class="lb">MAP</span></button>
    <button data-pane="text"><span class="ic">💬</span><span class="lb">TEXT</span></button>
    <button data-pane="link"><span class="ic">🔗</span><span class="lb">LINK</span></button>
  </nav>
</div>

<script>
const $ = (id) => document.getElementById(id);

let code = null;
let ws = null;
let wsAttempt = 0;
let photos = [];        // 업로드된 사진 URL 목록
let photoIndex = 0;
let liveWatchId = null;
let lastLiveSent = 0;

/* ── 접속 ───────────────────────────────── */
async function tryJoin(c) {
  const r = await fetch(`/api/room/${c}`);
  if (!r.ok) return false;
  code = c;
  localStorage.setItem("temir-code", c);
  $("hdr-code").textContent = c;
  $("join").style.display = "none";
  $("main").classList.add("on");
  const media = await fetch(`/api/media/${c}`).then((x) => x.json()).catch(() => ({ items: [] }));
  photos = media.items || [];
  renderThumbs();
  connect();
  return true;
}

$("join-btn").onclick = async () => {
  const c = $("join-code").value.trim();
  if (c.length !== 6) { $("join-err").textContent = "6자리 코드를 입력하세요."; return; }
  if (!(await tryJoin(c))) $("join-err").textContent = "코드를 찾을 수 없어요. Tesla 화면의 코드를 확인하세요.";
};
$("join-code").addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
});

(async () => {
  const urlCode = new URLSearchParams(location.search).get("code");
  if (urlCode && (await tryJoin(urlCode))) return;
  const saved = localStorage.getItem("temir-code");
  if (saved) $("join-code").value = saved;
})();

/* ── WebSocket ───────────────────────────── */
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/${code}?role=remote`);
  ws.onopen = () => { wsAttempt = 0; };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "presence") {
      const on = msg.tvConnected;
      $("hdr-dot").className = "dot " + (on ? "on" : "off");
      $("hdr-status").textContent = on ? "TV 연결됨" : "TV 꺼짐";
    } else if (msg.type === "scene" && msg.scene === "photo") {
      photoIndex = msg.payload?.index ?? photoIndex;   // 다른 리모컨과 인덱스 동기화
      renderThumbs();
    }
  };
  ws.onclose = () => {
    $("hdr-dot").className = "dot off";
    $("hdr-status").textContent = "재연결 중";
    setTimeout(connect, Math.min(1000 * 2 ** wsAttempt++, 10000));
  };
}
setInterval(() => { if (ws && ws.readyState === 1) ws.send('{"type":"ping"}'); }, 20000);

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function sendScene(scene, payload) { send({ type: "scene", scene, payload }); }
function sendCtl(action, extra = {}) { send({ type: "control", action, ...extra }); }

/* ── 탭 전환 ─────────────────────────────── */
document.querySelectorAll("nav.tabs button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("nav.tabs button").forEach((x) => x.classList.toggle("sel", x === b));
    document.querySelectorAll(".pane").forEach((p) =>
      p.classList.toggle("on", p.id === `pane-${b.dataset.pane}`));
  };
});
$("btn-idle").onclick = () => sendScene("idle", {});

/* ── 유튜브 ──────────────────────────────── */
function parseYoutubeId(input) {
  const s = input.trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(s);
    if (u.hostname.includes("youtu.be")) return u.pathname.slice(1).split("/")[0];
    if (u.searchParams.get("v")) return u.searchParams.get("v");
    const m = u.pathname.match(/\/(shorts|embed|live)\/([\w-]{11})/);
    if (m) return m[2];
  } catch (_) {}
  return null;
}

$("yt-send").onclick = () => {
  const id = parseYoutubeId($("yt-url").value);
  if (!id) { $("yt-url").value = ""; $("yt-url").placeholder = "올바른 YouTube 링크가 아니에요"; return; }
  sendScene("youtube", { videoId: id });
};

document.querySelectorAll("[data-ctl]").forEach((b) => {
  b.onclick = () => {
    const a = b.dataset.ctl;
    if (a === "seek") sendCtl("seek", { delta: Number(b.dataset.delta) });
    else sendCtl(a);
  };
});
$("yt-vol").oninput = (e) => {
  e.target.style.setProperty("--v", e.target.value + "%");
  sendCtl("volume", { value: Number(e.target.value) });
};

/* ── 사진 ───────────────────────────────── */
function renderThumbs() {
  const box = $("thumbs");
  box.innerHTML = "";
  photos.forEach((url, i) => {
    const b = document.createElement("button");
    if (i === photoIndex) b.className = "sel";
    b.innerHTML = `<img src="${url}" loading="lazy" alt="">`;
    b.onclick = () => { photoIndex = i; sendScene("photo", { items: photos, index: i }); renderThumbs(); };
    box.appendChild(b);
  });
}

function downscale(file, maxSide = 1600, quality = 0.82) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => resolve(blob || file), "image/jpeg", quality);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}

$("photo-file").addEventListener("change", async (e) => {
  const files = [...e.target.files];
  if (!files.length) return;
  const status = $("upload-status");
  for (let i = 0; i < files.length; i++) {
    status.textContent = `업로드 중… ${i + 1} / ${files.length}`;
    const blob = await downscale(files[i]);
    const form = new FormData();
    form.append("file", blob, "photo.jpg");
    try {
      const r = await fetch(`/api/upload/${code}`, { method: "POST", body: form });
      if (r.ok) photos.push((await r.json()).url);
    } catch (_) {}
  }
  status.textContent = `완료 — ${photos.length}장`;
  e.target.value = "";
  photoIndex = photos.length - 1;
  renderThumbs();
  sendScene("photo", { items: photos, index: photoIndex });
});

$("photo-prev").onclick = () => {
  if (!photos.length) return;
  photoIndex = (photoIndex - 1 + photos.length) % photos.length;
  sendScene("photo", { items: photos, index: photoIndex });
  renderThumbs();
};
$("photo-next").onclick = () => {
  if (!photos.length) return;
  photoIndex = (photoIndex + 1) % photos.length;
  sendScene("photo", { items: photos, index: photoIndex });
  renderThumbs();
};

/* ── 지도 ───────────────────────────────── */
$("map-search").onclick = doSearch;
$("map-q").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });

async function doSearch() {
  const q = $("map-q").value.trim();
  if (!q) return;
  const box = $("map-results");
  box.innerHTML = "<button disabled>검색 중…</button>";
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=ko&q=${encodeURIComponent(q)}`);
    const items = await r.json();
    box.innerHTML = "";
    if (!items.length) { box.innerHTML = "<button disabled>결과가 없어요</button>"; return; }
    items.forEach((it) => {
      const b = document.createElement("button");
      const name = it.name || it.display_name.split(",")[0];
      b.innerHTML = `${name}<small>${it.display_name}</small>`;
      b.onclick = () => {
        stopLive();
        sendScene("map", { lat: +it.lat, lng: +it.lon, label: name, zoom: 15 });
      };
      box.appendChild(b);
    });
  } catch (_) {
    box.innerHTML = "<button disabled>검색 실패 — 잠시 후 다시 시도</button>";
  }
}

$("geo-once").onclick = () => {
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      stopLive();
      sendScene("map", { lat: pos.coords.latitude, lng: pos.coords.longitude, label: "내 위치", zoom: 16 });
    },
    () => alert("위치 권한을 허용해 주세요."),
    { enableHighAccuracy: true, timeout: 8000 });
};

function stopLive() {
  if (liveWatchId !== null) {
    navigator.geolocation.clearWatch(liveWatchId);
    liveWatchId = null;
    $("geo-live").classList.remove("live-on");
    $("geo-live").textContent = "🛰 실시간 추적";
  }
}

$("geo-live").onclick = () => {
  if (liveWatchId !== null) { stopLive(); return; }
  liveWatchId = navigator.geolocation.watchPosition(
    (pos) => {
      const now = Date.now();
      if (now - lastLiveSent < 3000) return;   // 3초 간격으로 전송량 제한
      lastLiveSent = now;
      sendScene("map", { lat: pos.coords.latitude, lng: pos.coords.longitude, label: "내 위치", zoom: 16, live: true });
    },
    () => { alert("위치 권한을 허용해 주세요."); stopLive(); },
    { enableHighAccuracy: true });
  $("geo-live").classList.add("live-on");
  $("geo-live").textContent = "🛰 추적 중 (탭하여 중지)";
};

/* ── 텍스트 / 링크 ────────────────────────── */
let textSize = "l";
$("text-size").querySelectorAll("button").forEach((b) => {
  b.onclick = () => {
    textSize = b.dataset.size;
    $("text-size").querySelectorAll("button").forEach((x) => x.classList.toggle("sel", x === b));
  };
});
$("text-send").onclick = () => {
  const t = $("text-input").value.trim();
  if (t) sendScene("text", { text: t, size: textSize });
};

$("link-send").onclick = () => {
  let url = $("link-input").value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  sendScene("link", { url });
};
</script>
</body>
</html>
